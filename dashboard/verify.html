<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email — BuildBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --auth-bg: #f7f8fa;
      --auth-surface: #ffffff;
      --auth-border: #e4e7ed;
      --auth-text: #111827;
      --auth-muted: #6b7280;
      --auth-dim: #9ca3af;
      --auth-accent: #4f46e5;
      --auth-accent-hover: #4338ca;
      --auth-accent-light: #eef2ff;
      --auth-success: #059669;
      --auth-success-bg: #ecfdf5;
      --auth-danger: #dc2626;
      --auth-danger-bg: #fef2f2;
      --auth-shadow: 0 1px 3px rgba(17, 24, 39, 0.05), 0 1px 2px rgba(17, 24, 39, 0.04);
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--auth-bg);
      color: var(--auth-text);
      min-height: 100vh;
    }

    .auth-back {
      position: fixed;
      top: 20px;
      left: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--auth-muted);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s;
      z-index: 10;
      background: none;
      border: none;
      font-family: inherit;
    }
    .auth-back:hover { color: var(--auth-text); }
    .auth-back svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .auth-wrap {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .auth-box {
      width: 100%;
      background: var(--auth-surface);
      border: 1px solid var(--auth-border);
      border-radius: 16px;
      padding: 36px 36px 32px;
      box-shadow: var(--auth-shadow);
      animation: authCardIn 0.22s ease both;
    }

    @keyframes authCardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-box h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--auth-text);
      margin-bottom: 5px;
      letter-spacing: -0.3px;
      line-height: 1.25;
      font-family: 'Montserrat', sans-serif;
    }

    .auth-box > p {
      font-size: 13px;
      color: var(--auth-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .auth-status-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .auth-status-icon svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .auth-status-icon.loading {
      background: var(--auth-accent-light);
      color: var(--auth-accent);
    }
    .auth-status-icon.success {
      background: var(--auth-success-bg);
      color: var(--auth-success);
    }
    .auth-status-icon.error {
      background: var(--auth-danger-bg);
      color: var(--auth-danger);
    }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--auth-accent);
      color: #fff;
      padding: 12px 20px;
      border-radius: 9px;
      border: none;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--auth-accent-hover); }

    .auth-switch {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--auth-muted);
    }
    .auth-switch a {
      color: var(--auth-accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .auth-switch a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .auth-box {
        padding: 28px 22px 24px;
        border-radius: 14px;
      }
      .auth-back { top: 14px; left: 16px; }
    }
  </style>
</head>
<body>

  <a class="auth-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back to home
  </a>

  <div class="auth-wrap">
    <div class="auth-box" id="card">

      <div style="display:flex;align-items:center;gap:9px;margin-bottom:22px;">
        <div style="width:30px;height:30px;background:#4f46e5;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <span style="font-size:15px;font-weight:700;color:#111827;letter-spacing:-0.3px;">BuildBot</span>
      </div>

      <div class="auth-status-icon loading">
        <svg viewBox="0 0 24 24" class="spin">
          <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
          <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
          <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
        </svg>
      </div>

      <h2>Verifying your email…</h2>
      <p>Please wait a moment while we confirm your email address.</p>

    </div>
  </div>

<script>
const API = window.BB_API || 'https://buildbot-production-8faa.up.railway.app/api';

function setCard({ type, title, message, btnText, btnHref }) {
  const iconSvg = {
    success: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
    error:   `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
  };

  document.getElementById('card').innerHTML = `
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:22px;">
      <div style="width:30px;height:30px;background:#4f46e5;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <span style="font-size:15px;font-weight:700;color:#111827;letter-spacing:-0.3px;">BuildBot</span>
    </div>
    <div class="auth-status-icon ${type}">${iconSvg[type] || ''}</div>
    <h2>${title}</h2>
    <p>${message}</p>
    <a href="${btnHref}" class="btn">${btnText}</a>
    <div class="auth-switch"><a href="index.html">Back to home</a></div>
  `;
}

async function verify() {
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    setCard({
      type: 'error',
      title: 'Invalid link',
      message: 'This verification link is missing a token. Please use the link from your email.',
      btnText: 'Go to sign in',
      btnHref: 'index.html?dashboard=1'
    });
    return;
  }

  try {
    const res  = await fetch(`${API}/verify-email?token=${token}`);
    const data = await res.json();
    if (data.success) {
      setCard({
        type: 'success',
        title: 'Email verified',
        message: 'Your email address has been confirmed. You can now sign in to your dashboard.',
        btnText: 'Sign in now',
        btnHref: 'index.html?dashboard=1'
      });
    } else {
      setCard({
        type: 'error',
        title: 'Link expired',
        message: data.error || 'This verification link has expired. Please sign up again to get a new one.',
        btnText: 'Go to sign in',
        btnHref: 'index.html?dashboard=1'
      });
    }
  } catch {
    setCard({
      type: 'error',
      title: 'Connection error',
      message: 'Could not connect to the server. Please check your connection and try again.',
      btnText: 'Try again',
      btnHref: window.location.href
    });
  }
}

verify();
</script>
</body>
</html>
