<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — BuildBot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #f7f8fa;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4e7ed;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 1px 3px rgba(17,24,39,0.07), 0 4px 16px rgba(17,24,39,0.04);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
    }
    .logo-mark {
      width: 30px;
      height: 30px;
      background: #4f46e5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 15px; height: 15px; }
    .logo-text { font-size: 15px; font-weight: 700; color: #111827; letter-spacing: -0.2px; }
    h2 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 5px; letter-spacing: -0.2px; }
    .sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; line-height: 1.6; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .pwd-wrap { position: relative; }
    input[type=password], input[type=text] {
      width: 100%;
      padding: 10px 40px 10px 12px;
      background: #f7f8fa;
      border: 1px solid #e4e7ed;
      border-radius: 9px;
      color: #111827;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #4f46e5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    input::placeholder { color: #9ca3af; }
    .pwd-toggle {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .pwd-toggle:hover { color: #6b7280; }
    .pwd-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .strength-track {
      height: 3px;
      background: #e4e7ed;
      border-radius: 2px;
      margin: 8px 0 5px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0;
      transition: all 0.3s ease;
    }
    .hint { font-size: 11px; color: #9ca3af; line-height: 1.5; margin-bottom: 4px; }
    .btn {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn:hover { background: #4338ca; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .alert {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      border: 1px solid transparent;
    }
    .alert.show { display: block; }
    .alert-success { background: #ecfdf5; border-color: rgba(5,150,105,0.2); color: #059669; }
    .alert-error   { background: #fef2f2; border-color: rgba(220,38,38,0.2);   color: #dc2626; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <span class="logo-text">BuildBot</span>
  </div>

  <h2>Set new password</h2>
  <p class="sub">Choose a strong password for your account.</p>

  <div class="form-group">
    <label>New Password</label>
    <div class="pwd-wrap">
      <input type="password" id="password" placeholder="Min 8 characters" oninput="checkStrength(this.value)" autocomplete="new-password"/>
      <span class="pwd-toggle" onclick="togglePwd('password', this)">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
    </div>
    <div class="strength-track"><div class="strength-fill" id="strength-bar"></div></div>
    <div class="hint">Uppercase, lowercase, number and special character required.</div>
  </div>

  <div class="form-group">
    <label>Confirm Password</label>
    <div class="pwd-wrap">
      <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password"/>
      <span class="pwd-toggle" onclick="togglePwd('confirm', this)">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
    </div>
  </div>

  <button class="btn" id="reset-btn" onclick="doReset()">Reset Password</button>
  <div class="alert" id="alert"></div>
</div>

<script>
const API   = window.BB_API || 'https://buildbot-production.up.railway.app/api';
const token = new URLSearchParams(window.location.search).get('token');

function togglePwd(inputId, iconEl) {
  const input = document.getElementById(inputId);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  iconEl.innerHTML = isHidden
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

function checkStrength(val) {
  const bar = document.getElementById('strength-bar');
  let score = 0;
  if (val.length >= 8)                                          score++;
  if (/[A-Z]/.test(val))                                       score++;
  if (/[0-9]/.test(val))                                       score++;
  if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val))     score++;
  const colors = ['#e4e7ed','#dc2626','#d97706','#d97706','#059669'];
  bar.style.width      = (score / 4 * 100) + '%';
  bar.style.background = colors[score];
}

async function doReset() {
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const btn      = document.getElementById('reset-btn');
  if (!password || !confirm) return showAlert('Please fill in both fields.', 'error');
  if (password !== confirm)  return showAlert('Passwords do not match.', 'error');
  if (!token)                return showAlert('Invalid or missing reset link.', 'error');

  const orig = btn.innerHTML;
  btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/></svg>`;
  btn.disabled = true;

  try {
    const res  = await fetch(`${API}/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (data.success) {
      showAlert('Password reset successfully. Redirecting to login…', 'success');
      setTimeout(() => window.location.href = '/', 2500);
    } else {
      btn.innerHTML = orig;
      btn.disabled  = false;
      showAlert(data.error || 'Something went wrong.', 'error');
    }
  } catch {
    btn.innerHTML = orig;
    btn.disabled  = false;
    showAlert('Cannot connect to server. Please try again.', 'error');
  }
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className   = `alert alert-${type} show`;
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doReset();
});
</script>
</body>
</html>
