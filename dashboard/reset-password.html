<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — BuildBot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans', 'Segoe UI', sans-serif;background:#f7f8fa;
      color:#111827;min-height:100vh;display:flex;
      align-items:center;justify-content:center;}
    .box{background:#ffffff;border:1px solid #e4e7ed;border-radius:16px;
      padding:40px;max-width:420px;width:100%;box-shadow:0 4px 12px rgba(17,24,39,0.08);}
    .logo{display:flex;align-items:center;justify-content:center;gap:8px;
      font-size:20px;font-weight:700;color:#111827;
      margin-bottom:24px;text-align:center;}
    .logo-icon{width:32px;height:32px;background:#4f46e5;border-radius:8px;display:flex;align-items:center;justify-content:center;}
    .logo-icon svg{width:20px;height:20px;}
    h2{font-size:20px;color:#111827;margin-bottom:6px;font-weight:700;}
    p{font-size:14px;color:#6b7280;margin-bottom:24px;line-height:1.5;}
    label{font-size:12px;color:#374151;font-weight:600;
      text-transform:uppercase;letter-spacing:.5px;
      margin-bottom:6px;display:block;}
    input{width:100%;padding:12px 14px;background:#ffffff;
      border:1px solid #e4e7ed;border-radius:8px;color:#111827;
      font-size:14px;outline:none;margin-bottom:6px;transition:border-color 0.15s;}
    input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1);}
    input::placeholder{color:#9ca3af;}
    .hint{font-size:12px;color:#6b7280;margin-bottom:16px;line-height:1.5;}
    .btn{width:100%;padding:12px;background:#4f46e5;color:#ffffff;
      border:none;border-radius:8px;font-size:14px;font-weight:600;
      cursor:pointer;margin-top:4px;transition:background 0.15s;}
    .btn:hover{background:#4338ca;}
    .btn:disabled{opacity:0.6;cursor:not-allowed;}
    .alert{padding:12px;border-radius:8px;font-size:13px;
      margin-top:12px;display:none;}
    .alert.show{display:block;}
    .alert-success{background:#ecfdf5;border:1px solid rgba(5,150,105,0.2);color:#059669;}
    .alert-error{background:#fef2f2;border:1px solid rgba(220,38,38,0.2);color:#dc2626;}
    .strength{height:4px;border-radius:2px;background:#e4e7ed;
      margin-bottom:16px;overflow:hidden;}
    .strength-fill{height:100%;border-radius:2px;transition:all .3s;width:0;}
    .pwd-wrap{position:relative;display:block;}
    .pwd-wrap input{padding-right:40px;margin-bottom:0;}
    .pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.6;font-size:16px;transition:opacity 0.2s;color:#6b7280;}
    .pwd-toggle:hover{opacity:1;}
  </style>
<script src="config.js"></script>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    BuildBot
  </div>
  <h2>Reset Password 🔑</h2>
  <p>Enter your new password below.</p>

  <label>New Password</label>
  <div class="pwd-wrap" style="margin-bottom:6px;">
    <input type="password" id="password" placeholder="Min 8 chars" oninput="checkStrength(this.value)"/>
    <span class="pwd-toggle" onclick="togglePassword('password', this)">👁️</span>
  </div>
  <div class="strength"><div class="strength-fill" id="strength-bar"></div></div>
  <div class="hint">Must contain: uppercase, lowercase, number and special character<br/>Example: MyStore@123</div>

  <label>Confirm Password</label>
  <div class="pwd-wrap" style="margin-bottom:6px;">
    <input type="password" id="confirm" placeholder="Repeat password"/>
    <span class="pwd-toggle" onclick="togglePassword('confirm', this)">👁️</span>
  </div>

  <button class="btn" onclick="doReset()">Reset Password</button>
  <div class="alert" id="alert"></div>
</div>

<script>
const API   = window.BB_API || 'https://buildbot-production.up.railway.app/api';
const token = new URLSearchParams(window.location.search).get('token');

function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = '🙈';
  } else {
    input.type = 'password';
    icon.textContent = '👁️';
  }
}

function checkStrength(val) {
  const bar    = document.getElementById('strength-bar');
  let score    = 0;
  if (val.length >= 8)                              score++;
  if (/[A-Z]/.test(val))                           score++;
  if (/[0-9]/.test(val))                           score++;
  if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val)) score++;

  const colors = ['#dc2626','#d97706','#d97706','#059669','#059669'];
  bar.style.width  = (score / 4 * 100) + '%';
  bar.style.background = colors[score];
}

async function doReset() {
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const alert    = document.getElementById('alert');

  if (!password || !confirm)
    return showAlert('Please fill both fields.', 'error');
  if (password !== confirm)
    return showAlert('Passwords do not match.', 'error');
  if (!token)
    return showAlert('Invalid reset link.', 'error');

  try {
    const res  = await fetch(`${API}/reset-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (data.success) {
      showAlert('✅ Password reset! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = '/', 2500);
    } else {
      showAlert(data.error, 'error');
    }
  } catch {
    showAlert('Cannot connect to server.', 'error');
  }
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className   = `alert alert-${type} show`;
}
</script>
</body>
</html>
