<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — BuildBot</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',sans-serif;background:#0f1117;
      color:#e0e0e0;min-height:100vh;display:flex;
      align-items:center;justify-content:center;}
    .box{background:#1a1d27;border:1px solid #2a2d3e;border-radius:18px;
      padding:40px;max-width:420px;width:100%;}
    .logo{font-size:20px;font-weight:700;color:#7c6af7;
      margin-bottom:24px;text-align:center;}
    h2{font-size:20px;color:#fff;margin-bottom:6px;}
    p{font-size:13px;color:#888;margin-bottom:24px;}
    label{font-size:11px;color:#888;font-weight:700;
      text-transform:uppercase;letter-spacing:.5px;
      margin-bottom:6px;display:block;}
    input{width:100%;padding:11px 14px;background:#0f1117;
      border:1px solid #2a2d3e;border-radius:8px;color:#fff;
      font-size:13px;outline:none;margin-bottom:6px;}
    input:focus{border-color:#7c6af7;}
    .hint{font-size:11px;color:#666;margin-bottom:16px;line-height:1.5;}
    .btn{width:100%;padding:12px;background:#7c6af7;color:#fff;
      border:none;border-radius:8px;font-size:14px;font-weight:600;
      cursor:pointer;margin-top:4px;}
    .btn:hover{background:#5b4fe0;}
    .alert{padding:12px;border-radius:8px;font-size:13px;
      margin-top:12px;display:none;}
    .alert.show{display:block;}
    .alert-success{background:#1a3a2a;border:1px solid #2ecc71;color:#2ecc71;}
    .alert-error{background:#3a1a1a;border:1px solid #e74c3c;color:#e74c3c;}
    .strength{height:4px;border-radius:2px;background:#2a2d3e;
      margin-bottom:16px;overflow:hidden;}
    .strength-fill{height:100%;border-radius:2px;transition:all .3s;width:0;}
    .pwd-wrap{position:relative;display:block;}
    .pwd-wrap input{padding-right:40px;margin-bottom:0;}
    .pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.6;font-size:16px;transition:opacity 0.2s;}
    .pwd-toggle:hover{opacity:1;}
  </style>
</head>
<body>
<div class="box">
  <div class="logo">⚡ BuildBot</div>
  <h2>Reset Password 🔑</h2>
  <p>Enter your new password below.</p>

  <label>New Password</label>
  <div class="pwd-wrap" style="margin-bottom:6px;">
    <input type="password" id="password" placeholder="Min 8 chars" oninput="checkStrength(this.value)"/>
    <span class="pwd-toggle" onclick="togglePassword('password', this)">👁️</span>
  </div>
  <div class="strength"><div class="strength-fill" id="strength-bar"></div></div>
  <div class="hint">Must contain: uppercase, lowercase, number and special character<br/>Example: MyStore@123</div>

  <label>Confirm Password</label>
  <div class="pwd-wrap" style="margin-bottom:6px;">
    <input type="password" id="confirm" placeholder="Repeat password"/>
    <span class="pwd-toggle" onclick="togglePassword('confirm', this)">👁️</span>
  </div>

  <button class="btn" onclick="doReset()">Reset Password</button>
  <div class="alert" id="alert"></div>
</div>

<script>
const API   = 'https://buildbot-production.up.railway.app/api';
const token = new URLSearchParams(window.location.search).get('token');

function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = '🙈';
  } else {
    input.type = 'password';
    icon.textContent = '👁️';
  }
}

function checkStrength(val) {
  const bar    = document.getElementById('strength-bar');
  let score    = 0;
  if (val.length >= 8)                              score++;
  if (/[A-Z]/.test(val))                           score++;
  if (/[0-9]/.test(val))                           score++;
  if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val)) score++;

  const colors = ['#e74c3c','#f39c12','#f39c12','#2ecc71','#2ecc71'];
  bar.style.width  = (score / 4 * 100) + '%';
  bar.style.background = colors[score];
}

async function doReset() {
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const alert    = document.getElementById('alert');

  if (!password || !confirm)
    return showAlert('Please fill both fields.', 'error');
  if (password !== confirm)
    return showAlert('Passwords do not match.', 'error');
  if (!token)
    return showAlert('Invalid reset link.', 'error');

  try {
    const res  = await fetch(`${API}/reset-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (data.success) {
      showAlert('✅ Password reset! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = '/', 2500);
    } else {
      showAlert(data.error, 'error');
    }
  } catch {
    showAlert('Cannot connect to server.', 'error');
  }
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className   = `alert alert-${type} show`;
}
</script>
</body>
</html>
