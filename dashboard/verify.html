<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email — BuildBot</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',sans-serif;background:#0f1117;
      color:#e0e0e0;min-height:100vh;display:flex;
      align-items:center;justify-content:center;}
    .box{background:#1a1d27;border:1px solid #2a2d3e;border-radius:18px;
      padding:48px;text-align:center;max-width:420px;width:100%;}
    .icon{font-size:56px;margin-bottom:20px;}
    h2{font-size:22px;color:#fff;margin-bottom:10px;}
    p{font-size:14px;color:#888;margin-bottom:24px;line-height:1.6;}
    .btn{display:inline-block;background:#7c6af7;color:#fff;padding:12px 28px;
      border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;}
    .success{color:#2ecc71;}
    .error{color:#e74c3c;}
  </style>
</head>
<body>
<div class="box" id="box">
  <div class="icon">⏳</div>
  <h2>Verifying your email...</h2>
  <p>Please wait a moment.</p>
</div>
<script>
const API = 'https://buildbot-production.up.railway.app/api';

async function verify() {
  const token = new URLSearchParams(window.location.search).get('token');
  const box   = document.getElementById('box');

  if (!token) {
    box.innerHTML = `
      <div class="icon">❌</div>
      <h2 class="error">Invalid Link</h2>
      <p>This verification link is invalid.</p>
      <a href="/" class="btn">Go to Dashboard</a>`;
    return;
  }

  try {
    const res  = await fetch(`${API}/verify-email?token=${token}`);
    const data = await res.json();
    if (data.success) {
      box.innerHTML = `
        <div class="icon">✅</div>
        <h2 class="success">Email Verified!</h2>
        <p>Your email has been verified. You can now login.</p>
        <a href="/" class="btn">Login Now →</a>`;
    } else {
      box.innerHTML = `
        <div class="icon">❌</div>
        <h2 class="error">Link Expired</h2>
        <p>${data.error || 'This link has expired. Please signup again.'}</p>
        <a href="/" class="btn">Go to Dashboard</a>`;
    }
  } catch {
    box.innerHTML = `
      <div class="icon">⚠️</div>
      <h2>Something went wrong</h2>
      <p>Could not connect to server. Try again later.</p>
      <a href="/" class="btn">Go to Dashboard</a>`;
  }
}
verify();
</script>
</body>
</html>
